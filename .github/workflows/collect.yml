# 데일리 트렌드 자동 수집
# 한국 시간 07:17 · 12:17 · 18:17 에 collect.mjs 를 돌리고,
# 새 데이터(viewer/data/)를 저장소에 커밋합니다.
# Actions 탭 → "트렌드 수집" → Run workflow 로 지금 바로 돌릴 수도 있습니다.

name: 트렌드 수집

on:
  schedule:
    - cron: "17 22,3,9 * * *"   # UTC 기준 (= 한국 07:17, 12:17, 18:17)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: 수집
        run: node collect.mjs

      - name: 변경분 커밋
        run: |
          git config user.name "trend-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viewer/data
          if git diff --cached --quiet; then
            echo "바뀐 데이터 없음"
            exit 0
          fi
          git commit -m "데이터 수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
